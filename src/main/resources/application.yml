server:
  port: 8080

spring:
  application:
    name: agentflow
  config:
    # 导入本地密钥文件（不入库）：里面的属性优先级更高，会覆盖本文件里的同名占位符。
    # optional: 文件不存在也能正常启动
    import: optional:file:./application-local.yml
  # ===== 数据库（Phase 2 起启用；账号密码来自 docker-compose.yml 的初始化设置）=====
  # 注意：datasource/jpa 必须缩进在 spring: 名下——上次写错位置，被解析成了 management 的子项
  datasource:
    # 宿主机端口 13306（docker-compose.yml 里映射到容器的 3306）
    url: jdbc:mysql://localhost:13306/agentflow?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: agentflow
    password: agentflow123
  jpa:
    hibernate:
      # 开发期：Hibernate 按实体类自动建表/加列。生产环境会换成显式迁移脚本（如 Flyway）
      ddl-auto: update
    # 学习期打开：控制台能看到框架生成的 SQL
    show-sql: true
  # 文档上传 multipart 上限（默认 1MB 对真实 PDF 太小）；业务层另有 20MB 校验
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 26MB
  data:
    # embedding 缓存与（B 块起的）向量库共用这个 Redis；Redis 挂了缓存自动降级为直调 API
    redis:
      host: localhost
      port: 6379

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

# ===== LLM 接入（DeepSeek，OpenAI 兼容协议）=====
# api-key 实际值在 application-local.yml（不入库）；${LLM_API_KEY:} 是备用来源（系统环境变量）
llm:
  base-url: https://api.deepseek.com
  api-key: ${LLM_API_KEY:}
  model: deepseek-chat
  timeout-seconds: 120

# ===== 智谱开放平台（embedding 用：DeepSeek 不提供 embedding 接口，Phase 2.3 RAG 使用）=====
zhipu:
  api-key: ${ZHIPU_API_KEY:}

# ===== RAG 管线（Phase 2.3）=====
rag:
  chunking:
    # structural = 结构感知（标题/段落边界 + 重叠），fixed = 固定滑窗（cx-ai 课设做法，留作对比实验基线）
    strategy: structural
    chunk-size: 400        # 目标块长（字符，全角当量按 1 计）
    overlap-percent: 15    # 相邻块重叠占比（%）
  embedding:
    model: embedding-3
    # 维度决定向量库索引参数（先定维度再建索引）；embedding-3 支持 256/512/1024/2048，
    # 1024 是质量/内存甜点位（HNSW 内存 ≈ 向量数 × 维度 × 4B × 图结构系数）
    dimensions: 1024
    batch-size: 16         # 批量 embedding 的每批条数（智谱单请求有条数上限，留余量）
  top-k: 4                 # 检索问答默认带进 prompt 的块数
  # 向量存储实现：redis = Redis Stack HNSW（默认，B 块）；json = 文件 + 内存暴力余弦（评测对比基线）
  vector-store: redis
  # 上传原件与向量库文件的落盘根目录（已 gitignore）
  data-dir: ./data
