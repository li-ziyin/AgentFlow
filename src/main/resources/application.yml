# ===== LLM 接入（DeepSeek，OpenAI 兼容协议）=====
# api-key 从环境变量 LLM_API_KEY 读取，不写进任何文件；
# `:` 后为空默认值，保证没配环境变量时应用也能启动（Phase 1 会加启动校验）
llm:
  base-url: https://api.deepseek.com
  api-key: ${LLM_API_KEY:}
  model: deepseek-chat
  timeout-seconds: 120
