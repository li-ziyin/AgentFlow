server:
  port: 8080

spring:
  application:
    name: agentflow

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

# ===== 数据库配置（第 3 周接入 MySQL 时取消注释）=====
