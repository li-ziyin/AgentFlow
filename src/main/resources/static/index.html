<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AgentFlow 控制台</title>
<style>
  /* ===== 设计令牌：仪器面板 —— 深色仪表侧栏 + 冷灰纸面主区，钢蓝作唯一强调色 ===== */
  :root {
    --ink: #10151b;        /* 侧栏底 */
    --ink-raise: #1b242f;  /* 侧栏悬停/选中 */
    --line-dark: #26313d;  /* 侧栏分隔线 */
    --paper: #eef1f4;      /* 主区底 */
    --card: #ffffff;
    --accent: #31708e;     /* 钢蓝：当前会话指示条 / 用户气泡 */
    --accent-soft: #e2edf3;
    --text: #1d2730;
    --muted: #84919e;
    --muted-dark: #7c8b99; /* 侧栏内的弱文字 */
    --danger: #a03b3b;
    --mono: "Cascadia Code", "JetBrains Mono", Consolas, monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
    color: var(--text);
    background: var(--paper);
    display: grid;
    grid-template-columns: 268px 1fr;
    grid-template-rows: minmax(0, 1fr);  /* 显式声明唯一一行撑满容器：隐式行按内容收缩，短对话时应用会缩成一小块 */
    height: 100vh;
    overflow: hidden;
  }

  /* ===== 侧栏：会话历史 ===== */
  aside {
    background: var(--ink);
    color: #dbe3ea;
    display: flex;
    flex-direction: column;
    min-width: 0;
    min-height: 0;   /* grid/flex 子项默认 min-height:auto 会拒绝收缩，导致内部滚动失效 */
  }
  .wordmark {
    padding: 18px 18px 14px;
    border-bottom: 1px solid var(--line-dark);
  }
  .wordmark strong {
    font-family: var(--mono);
    font-size: 17px;
    letter-spacing: .5px;
    color: #f0f5f9;
  }
  .wordmark span {
    display: block;
    margin-top: 3px;
    font-size: 11px;
    color: var(--muted-dark);
  }
  .new-chat {
    margin: 14px 14px 10px;
    padding: 9px 12px;
    background: transparent;
    color: #dbe3ea;
    border: 1px solid var(--line-dark);
    border-radius: 6px;
    font-size: 13px;
    cursor: pointer;
    text-align: left;
  }
  .new-chat:hover, .new-chat:focus-visible { background: var(--ink-raise); border-color: #38475a; }
  .session-list { flex: 1; min-height: 0; overflow-y: auto; padding: 4px 8px 10px; }
  .session-list .empty { padding: 14px 10px; font-size: 12px; color: var(--muted-dark); }
  .session-item {
    width: 100%;
    display: block;
    padding: 9px 10px 9px 13px;
    margin: 2px 0;
    background: transparent;
    border: none;
    border-left: 3px solid transparent;
    border-radius: 4px;
    color: inherit;
    text-align: left;
    cursor: pointer;
    font: inherit;
    min-width: 0;
  }
  .session-item:hover { background: var(--ink-raise); }
  .session-item.active {
    background: var(--ink-raise);
    border-left-color: var(--accent);
  }
  .session-item .preview {
    display: block;
    font-size: 13px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .session-item.active .preview { color: #fff; }
  .session-item .meta {
    display: block;
    margin-top: 3px;
    font-family: var(--mono);
    font-size: 11px;
    color: var(--muted-dark);
  }
  aside footer {
    padding: 10px 16px;
    border-top: 1px solid var(--line-dark);
    font-size: 11px;
    color: var(--muted-dark);
  }

  /* ===== 主区：状态行 / 消息流 / 输入区 ===== */
  main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  .statusbar {
    display: flex;
    align-items: baseline;
    gap: 14px;
    padding: 9px 18px;
    background: #fff;
    border-bottom: 1px solid #dde3e9;
    font-family: var(--mono);
    font-size: 12px;
    color: var(--muted);
  }
  .statusbar .where { color: var(--accent); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #msgs { flex: 1; min-height: 0; overflow-y: auto; padding: 20px 24px; display: flex; flex-direction: column; gap: 10px; }
  /* 短对话时消息贴着输入框（锚定底部），长对话时 margin 自动归零、正常滚动 */
  #msgs > :first-child { margin-top: auto; }
  .msg {
    max-width: min(72%, 640px);
    padding: 10px 14px;
    border-radius: 10px;
    line-height: 1.65;
    white-space: pre-wrap;
    word-break: break-word;
    font-size: 14px;
  }
  .user { align-self: flex-end; background: var(--accent); color: #fff; border-bottom-right-radius: 3px; }
  .bot  { align-self: flex-start; background: var(--card); border: 1px solid #dfe5ea; border-bottom-left-radius: 3px; }
  .bot.error { background: #f9efef; border-color: #e4c8c8; color: var(--danger); }
  .hint { align-self: center; color: var(--muted); font-size: 12px; text-align: center; }
  .composer {
    display: flex;
    gap: 10px;
    padding: 12px 18px;
    background: #fff;
    border-top: 1px solid #dde3e9;
  }
  /* 知识库开关：发出 kbEnabled=true，走检索→引用→sources 卡片链路 */
  .kb-toggle {
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 12px;
    color: var(--muted);
    cursor: pointer;
    user-select: none;
    white-space: nowrap;
  }
  .kb-toggle input { display: none; }
  .kb-toggle .switch {
    width: 30px;
    height: 17px;
    border-radius: 9px;
    background: #cfd7de;
    position: relative;
    transition: background .15s ease;
  }
  .kb-toggle .switch::after {
    content: "";
    position: absolute;
    top: 2px;
    left: 2px;
    width: 13px;
    height: 13px;
    border-radius: 50%;
    background: #fff;
    transition: left .15s ease;
  }
  .kb-toggle input:checked + .switch { background: var(--accent); }
  .kb-toggle input:checked + .switch::after { left: 15px; }
  .kb-toggle input:focus-visible + .switch { outline: 2px solid var(--accent); outline-offset: 2px; }
  /* 来源卡片：sources 事件帧渲染在回答气泡下方 */
  .sources {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    max-width: min(85%, 700px);
    align-self: flex-start;
  }
  .src-card {
    background: var(--accent-soft);
    border: 1px solid #cddfe8;
    border-radius: 7px;
    padding: 5px 9px;
    font-size: 11px;
    line-height: 1.5;
    color: #45607a;
    max-width: 260px;
    cursor: default;
  }
  .src-card .ref { font-weight: 700; color: var(--accent); }
  .src-card .file { font-weight: 600; }
  .src-card .head { color: var(--muted); display: block; }
  textarea {
    flex: 1;
    resize: none;
    border: 1px solid #cfd7de;
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 14px;
    font-family: inherit;
    height: 46px;
    outline: none;
  }
  textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
  .composer button {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 0 24px;
    font-size: 14px;
    cursor: pointer;
  }
  .composer button:disabled { background: #a5bfcf; cursor: not-allowed; }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* ===== 窄屏：侧栏收成抽屉 ===== */
  .side-toggle { display: none; }
  @media (max-width: 720px) {
    body { grid-template-columns: 1fr; }
    aside { position: fixed; inset: 0 auto 0 0; width: 268px; z-index: 10; transform: translateX(-100%); transition: transform .18s ease; }
    body.side-open aside { transform: none; }
    .side-toggle {
      display: inline-block;
      background: transparent;
      border: none;
      color: #fff;
      font-size: 17px;
      cursor: pointer;
      padding: 4px 8px;
    }
  }
  @media (prefers-reduced-motion: reduce) { aside { transition: none; } }
</style>
</head>
<body>

<aside id="sidebar">
  <div class="wordmark">
    <strong>AgentFlow</strong>
    <span>多 Agent 工作流平台 · 控制台</span>
  </div>
  <button class="new-chat" id="newBtn">＋ 新对话</button>
  <nav class="session-list" id="sessionList" aria-label="会话历史"></nav>
  <footer>Enter 发送 · Shift+Enter 换行</footer>
</aside>

<main>
  <div class="statusbar">
    <button class="side-toggle" id="sideToggle" aria-label="打开会话列表">☰</button>
    <span class="where" id="whereLabel">未选择会话</span>
    <span id="statLabel"></span>
  </div>
  <div id="msgs">
    <div class="hint">从左侧选择一个会话继续，或点「＋ 新对话」开始。</div>
  </div>
  <div class="composer">
    <label class="kb-toggle" title="开启后先检索知识库再回答，回答带引用来源">
      <input type="checkbox" id="kbToggle">
      <span class="switch"></span>
      知识库
    </label>
    <textarea id="input" placeholder="输入消息…"></textarea>
    <button id="sendBtn">发送</button>
  </div>
</main>

<script>
// ===== 状态 =====
// 当前会话 id 持久在 localStorage：刷新后自动回到上次所在会话——"知道自己在哪"。
let currentId = localStorage.getItem('agentflow_sid') || null;
let loadedId = null;    // 当前气泡区里真正加载了消息的会话——防重复加载的依据，别用 currentId 判断
let sessions = [];      // 侧栏数据
let busy = false;
// 知识库模式也持久化：刷新后保持上次的选择
let kbOn = localStorage.getItem('agentflow_kb') === '1';

const msgs = document.getElementById('msgs');
const input = document.getElementById('input');
const sendBtn = document.getElementById('sendBtn');
const kbToggle = document.getElementById('kbToggle');
const whereLabel = document.getElementById('whereLabel');
const statLabel = document.getElementById('statLabel');
const sessionList = document.getElementById('sessionList');
kbToggle.checked = kbOn;
kbToggle.addEventListener('change', () => {
  kbOn = kbToggle.checked;
  localStorage.setItem('agentflow_kb', kbOn ? '1' : '0');
  input.focus();
});

// ===== 小工具 =====
function fmtTime(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  const p = n => String(n).padStart(2, '0');
  return `${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}
function addMsg(cls, text) {
  const div = document.createElement('div');
  div.className = 'msg ' + cls;
  div.textContent = text;
  msgs.appendChild(div);
  msgs.scrollTop = msgs.scrollHeight;
  return div;
}
function hint(text) { addMsg('hint', text); }
function clearMsgs() { msgs.innerHTML = ''; }
function updateWhere() {
  const s = sessions.find(x => x.sessionId === currentId);
  whereLabel.textContent = s ? (s.preview || '（空会话）') : (currentId ? '未命名的会话' : '未选择会话');
  statLabel.textContent = currentId ? `${s ? s.messageCount : 0} 条 · ${currentId.slice(0, 8)}` : '';
}

// ===== 会话列表 =====
async function refreshSessions() {
  try {
    const r = await fetch('/api/sessions');
    const body = await r.json();
    sessions = body.data || [];
    renderSessions();
    updateWhere();
  } catch (e) { hint('会话列表加载失败：' + e.message); }
}
function renderSessions() {
  sessionList.innerHTML = '';
  if (!sessions.length) {
    const div = document.createElement('div');
    div.className = 'empty';
    div.textContent = '还没有会话，点上面的「＋ 新对话」。';
    sessionList.appendChild(div);
    return;
  }
  for (const s of sessions) {
    const btn = document.createElement('button');
    btn.className = 'session-item' + (s.sessionId === currentId ? ' active' : '');
    btn.innerHTML = '<span class="preview"></span><span class="meta"></span>';
    btn.querySelector('.preview').textContent = s.preview || '（空会话）';
    btn.querySelector('.meta').textContent = `${s.messageCount} 条 · ${fmtTime(s.lastAt)}`;
    btn.addEventListener('click', () => openSession(s.sessionId));
    sessionList.appendChild(btn);
  }
}
async function openSession(id) {
  // 只拦截"气泡区里已经是这个会话"的重复加载；启动续接时 loadedId 为空，不会被拦
  if (busy || id === loadedId) { closeDrawer(); return; }
  currentId = id;
  localStorage.setItem('agentflow_sid', id);
  clearMsgs();
  try {
    const r = await fetch(`/api/sessions/${encodeURIComponent(id)}/messages`);
    const body = await r.json();
    for (const m of (body.data || [])) addMsg(m.role === 'user' ? 'user' : 'bot', m.content);
    if (!(body.data || []).length) hint('这个会话还没有消息。');
  } catch (e) { hint('历史加载失败：' + e.message); }
  loadedId = id;
  renderSessions();
  updateWhere();
  msgs.scrollTop = msgs.scrollHeight;
  closeDrawer();
}
function newChat() {
  currentId = null;
  loadedId = null;
  localStorage.removeItem('agentflow_sid');
  clearMsgs();
  hint('新对话已就绪。发出第一条消息后，会话会自动建立并出现在左侧。');
  renderSessions();
  updateWhere();
  input.focus();
}

// ===== 发送与 SSE 解析 =====
async function send() {
  const text = input.value.trim();
  if (!text || busy) return;
  busy = true; sendBtn.disabled = true;
  input.value = '';
  if (currentId === null) clearMsgs();
  addMsg('user', text);
  const bot = addMsg('bot', '');
  let answer = '';

  try {
    // 不用 EventSource：它只支持 GET，而对话是 POST——fetch 手动读流是同类产品的标准做法
    const resp = await fetch('/api/chat/stream', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ sessionId: currentId, message: text, kbEnabled: kbOn })
    });
    if (!resp.ok || !resp.body) throw new Error('HTTP ' + resp.status);

    const reader = resp.body.getReader();
    const decoder = new TextDecoder();  // stream:true 保证跨包的中文不乱码
    let buf = '';
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      let sep;
      while ((sep = buf.indexOf('\n\n')) >= 0) {
        const frame = buf.slice(0, sep).replace(/\r/g, '');
        buf = buf.slice(sep + 2);
        if (handleFrame(frame, bot, s => { answer += s; }) === 'session') {
          localStorage.setItem('agentflow_sid', currentId);
          updateWhere();
          refreshSessions();   // 新会话诞生，侧栏立刻出现
        }
      }
    }
    refreshSessions();         // 结束后再刷一次：预览/条数/排序更新
  } catch (e) {
    bot.classList.add('error');
    bot.textContent += (answer ? '\n' : '') + '请求失败：' + e.message;
  } finally {
    busy = false; sendBtn.disabled = false;
    input.focus();
  }
}
function handleFrame(frame, bot, onDelta) {
  let name = 'message', dataLines = [];
  for (const line of frame.split('\n')) {
    if (line.startsWith('event:')) name = line.slice(6).trim();
    else if (line.startsWith('data:')) {
      let d = line.slice(5);
      if (d.startsWith(' ')) d = d.slice(1);
      dataLines.push(d);
    }
  }
  const data = dataLines.join('\n');
  if (name === 'session') { currentId = data; loadedId = data; return name; }
  if (name === 'delta') {
    let piece = data;
    try { piece = JSON.parse(data); } catch (_) { /* 兼容未编码的纯文本增量 */ }
    bot.textContent += piece;
    msgs.scrollTop = msgs.scrollHeight;
    onDelta(piece);
    return name;
  }
  if (name === 'error') {
    bot.classList.add('error');
    bot.textContent += '\n[错误] ' + data;
    return name;
  }
  if (name === 'sources') {
    // 协议 2.6/D：回答流结束后的来源帧。JSON 解析失败就静默忽略（降级为不显示卡片）
    let obj = null;
    try { obj = JSON.parse(data); } catch (_) { return name; }
    renderSources(bot, obj.sources || []);
    return name;
  }
  return name;
}

/** 来源卡片：[n] 与回答里的引用编号对应；悬停看完整片段 */
function renderSources(bot, sources) {
  if (!sources.length) return;
  const row = document.createElement('div');
  row.className = 'sources';
  for (const s of sources) {
    const card = document.createElement('div');
    card.className = 'src-card';
    const head = document.createElement('span');
    head.className = 'head';
    head.textContent = s.heading ? s.heading : ('块 #' + s.chunkIdx);
    const label = document.createElement('span');
    label.className = 'ref';
    label.textContent = '[' + s.ref + '] ';
    const file = document.createElement('span');
    file.className = 'file';
    file.textContent = s.filename + ' · ' + (s.score * 100).toFixed(0) + '%';
    card.title = s.snippet;
    card.appendChild(head);
    card.appendChild(label);
    card.appendChild(file);
    row.appendChild(card);
  }
  bot.after(row);
  msgs.scrollTop = msgs.scrollHeight;
}

// ===== 事件与启动 =====
sendBtn.addEventListener('click', send);
input.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});
document.getElementById('newBtn').addEventListener('click', newChat);
document.getElementById('sideToggle').addEventListener('click', () => document.body.classList.toggle('side-open'));
function closeDrawer() { document.body.classList.remove('side-open'); }

refreshSessions().then(() => {
  // 上次聊到哪，回到哪（该会话在列表里才回放）
  if (currentId && sessions.some(s => s.sessionId === currentId)) openSession(currentId);
  else { currentId = null; updateWhere(); }
});
input.focus();
</script>
</body>
</html>
