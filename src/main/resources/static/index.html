<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AgentFlow Chat</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, -apple-system, "Microsoft YaHei", sans-serif; background: #f4f6f8; height: 100vh; display: flex; flex-direction: column; }
  header { background: #1f2937; color: #fff; padding: 10px 16px; display: flex; align-items: center; gap: 12px; }
  header h1 { font-size: 16px; font-weight: 600; }
  header .sid { font-size: 12px; color: #9ca3af; font-family: monospace; overflow: hidden; text-overflow: ellipsis; max-width: 40vw; }
  header button { margin-left: auto; background: #374151; color: #fff; border: none; border-radius: 6px; padding: 6px 12px; cursor: pointer; font-size: 12px; }
  header button:hover { background: #4b5563; }
  main { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 72%; padding: 10px 14px; border-radius: 12px; line-height: 1.6; white-space: pre-wrap; word-break: break-word; font-size: 14px; }
  .user  { align-self: flex-end; background: #2563eb; color: #fff; border-bottom-right-radius: 4px; }
  .bot   { align-self: flex-start; background: #fff; color: #1f2937; border: 1px solid #e5e7eb; border-bottom-left-radius: 4px; }
  .bot.error { background: #fef2f2; border-color: #fecaca; color: #b91c1c; }
  .hint  { align-self: center; color: #9ca3af; font-size: 12px; }
  footer { padding: 12px 16px; background: #fff; border-top: 1px solid #e5e7eb; display: flex; gap: 10px; }
  textarea { flex: 1; resize: none; border: 1px solid #d1d5db; border-radius: 8px; padding: 10px; font-size: 14px; font-family: inherit; height: 44px; outline-color: #2563eb; }
  footer button { background: #2563eb; color: #fff; border: none; border-radius: 8px; padding: 0 22px; font-size: 14px; cursor: pointer; }
  footer button:disabled { background: #93c5fd; cursor: not-allowed; }
</style>
</head>
<body>
<header>
  <h1>AgentFlow Chat</h1>
  <span class="sid" id="sidLabel">会话：未开始</span>
  <button id="newBtn">新会话</button>
</header>
<main id="msgs">
  <div class="hint">发一条消息开始对话。刷新页面后带着同一会话 id，对话仍能继续。</div>
</main>
<footer>
  <textarea id="input" placeholder="输入消息，Enter 发送，Shift+Enter 换行"></textarea>
  <button id="sendBtn">发送</button>
</footer>

<script>
// ==== 会话状态 ====
// sessionId 存在浏览器 localStorage：刷新页面不丢，对话可以续接。
// 注意方向：是"客户端保存 id、请求时带上"，服务器本身不认识你——无状态服务的客户端配合。
let sessionId = localStorage.getItem('agentflow_sid') || null;

const msgs = document.getElementById('msgs');
const input = document.getElementById('input');
const sendBtn = document.getElementById('sendBtn');
const sidLabel = document.getElementById('sidLabel');
let busy = false;

function showSid() { sidLabel.textContent = '会话：' + (sessionId || '未开始'); }
function addMsg(cls, text) {
  const div = document.createElement('div');
  div.className = 'msg ' + cls;
  div.textContent = text;
  msgs.appendChild(div);
  msgs.scrollTop = msgs.scrollHeight;
  return div;
}
function bubble(title) { addMsg('hint', title); }

// ==== 发送与流式解析 ====
async function send() {
  const text = input.value.trim();
  if (!text || busy) return;
  busy = true; sendBtn.disabled = true;
  input.value = '';
  addMsg('user', text);
  const bot = addMsg('bot', '');
  let answer = '';

  try {
    // 为什么不用 EventSource？——它只支持 GET，而我们的对话接口是 POST。
    // 所以用 fetch + ReadableStream 手动读流，这是 ChatGPT 类产品网页端的标准做法。
    const resp = await fetch('/api/chat/stream', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ sessionId: sessionId, message: text })
    });
    if (!resp.ok || !resp.body) throw new Error('HTTP ' + resp.status);

    const reader = resp.body.getReader();
    const decoder = new TextDecoder();  // stream:true 让跨 chunk 的中文字节也能正确解码
    let buf = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });

      // SSE 协议帧以空行分隔：一帧 = event:xxx + data:yyy
      let sep;
      while ((sep = buf.indexOf('\n\n')) >= 0) {
        const frame = buf.slice(0, sep).replace(/\r/g, '');
        buf = buf.slice(sep + 2);
        const ev = handleFrame(frame, bot, s => { answer += s; });
        if (ev === 'session') { localStorage.setItem('agentflow_sid', sessionId); showSid(); }
      }
    }
  } catch (e) {
    bot.classList.add('error');
    bot.textContent += (answer ? '\n' : '') + '请求失败：' + e.message;
  } finally {
    busy = false; sendBtn.disabled = false;
    input.focus();
  }
}

/** 解析一帧 SSE。返回事件名。delta 追加到气泡，error 标红，session 记录会话 id。 */
function handleFrame(frame, bot, onDelta) {
  let name = 'message', dataLines = [];
  for (const line of frame.split('\n')) {
    if (line.startsWith('event:')) name = line.slice(6).trim();
    else if (line.startsWith('data:')) {
      let d = line.slice(5);
      if (d.startsWith(' ')) d = d.slice(1);   // SSE 规范：冒号后的一个空格不属于内容
      dataLines.push(d);
    }
  }
  const data = dataLines.join('\n');
  if (name === 'session') { sessionId = data; return name; }
  if (name === 'delta')   { bot.textContent += data; msgs.scrollTop = msgs.scrollHeight; onDelta(data); return name; }
  if (name === 'error')   { bot.classList.add('error'); bot.textContent += '\n[错误] ' + data; return name; }
  return name;
}

// ==== 交互事件 ====
sendBtn.addEventListener('click', send);
input.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});
document.getElementById('newBtn').addEventListener('click', () => {
  sessionId = null;
  localStorage.removeItem('agentflow_sid');
  showSid();
  msgs.innerHTML = '';
  bubble('已开启新会话。服务器那边旧对话还在，但已经和这个页面无关了。');
});

showSid();
input.focus();
</script>
</body>
</html>
