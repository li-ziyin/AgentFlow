# 数据库和缓存用 Docker 起，第 3 周接入存储层时再启动：
#   docker compose up -d
# 查看日志：docker compose logs -f mysql
services:
  mysql:
    image: mysql:8.0
    container_name: agentflow-mysql
    restart: unless-stopped   # Docker 启动时自动拉起，机器重启/睡眠恢复后不用手动管
    environment:
      MYSQL_ROOT_PASSWORD: root123456
      MYSQL_DATABASE: agentflow
      MYSQL_USER: agentflow
      MYSQL_PASSWORD: agentflow123
    ports:
      # 宿主机 13306 -> 容器 3306：Windows(Hyper-V/WSL) 重启后会随机保留端口段，
      # 3306 曾被圈进保留段导致绑定失败，用非常规端口绕开
      - "13306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

  redis:
    # Redis Stack = 原生 Redis + RediSearch 模块（FT.CREATE/FT.SEARCH，含 HNSW 向量索引）。
    # A 块的 embedding 缓存只用普通 KV；B 块起向量检索依赖 RediSearch——镜像从 redis:7 换过来
    image: redis/redis-stack-server:latest
    container_name: agentflow-redis
    restart: unless-stopped
    # AOF 持久化：容器重启向量数据不丢（默认只有 RDB 快照，最多丢 1 分钟写入）
    command: redis-stack-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

volumes:
  mysql-data:
  redis-data:
